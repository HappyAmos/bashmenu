name: Lint Shell Scripts

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  shellcheck:
    name: Run Native ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint Shell Scripts
        run: |
          shellcheck *.sh scripts/*.sh
