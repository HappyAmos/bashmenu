version: 0.0.1
user:
  divider:
    char: '{ascii:196}'
    length: '{window_width}'
  example_boolean: true
  example_filepath: '{bashmenu_dir}'
  example_string: A string of text
  localip: "[b]{command:hostname -I | awk '{print $1}'}[/b]"
  postal_code: 49079
  this_day: "curl 'https://today.zenquotes.io/{command:date %m}/{command:date %e}'"
settings:
  cache_dir: '{home}/.cache/bashmenu'
  check_for_updates: false
  dns:
    ipv4:
      primary: 192.168.4.47
      secondary: 1.1.1.1
    ipv6:
      primary: fdbd:6905:d4e0:1:7605:d849:9be:4689
      secondary: 2606:4700:4700::1111
  ping_target: 192.168.4.47
  plugins:
    otd:
      script: otd.sh
      sleep: 300
      pretext: '{user.divider}'
      posttext: '{user.divider}'
  scripts_dir: '{bashmenu_dir}/scripts'
  show_menu_shortcuts: true
  status_gutter: '{user} : {user-mode} | Battery: {battery} | {date_time_24_short} | {user.localip}'
  tab_to_spaces: true
  tabstop: 4
  templates_dir: '{bashmenu_dir}/templates'
  use_nerd_fonts: true
theme: dracula
