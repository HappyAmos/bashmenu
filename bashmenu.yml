version: 0.0.1
theme: matrix
user:
  example_boolean: true
  example_filepath: '{bashmenu_dir}'
  example_string: A string of text
  localip: '[b]{localip}[/b]'
  postal_code: 49079
settings:
  cache_dir: '{home}/.cache/bashmenu'
  check_for_updates: false
  plugins:
    otd:
      script: otd.sh
      sleep: 300
      pretext: '{divider}'
      posttext: '{divider}'
    weather:
      script: "curl -s 'wttr.in/{user.postal_code}?format=4'"
      sleep: 300
      pretext: ''
      posttext: '{divider}'
  templates_dir: '{bashmenu_dir}/templates'
  scripts_dir: '{bashmenu_dir}/scripts'
  ping_target: 1.1.1.1
  tab_to_spaces: true
  tabstop: 4
  show_menu_shortcuts: true
  use_nerd_fonts: true
  nerd_font_width: auto
  status_gutter: '{user} | Battery: {battery} | {user.localip} | {date_time_24}'
